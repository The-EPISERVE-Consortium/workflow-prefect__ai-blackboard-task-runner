defaults:
  work_pool_name: kubernetes-pool
  provider: zib
  model: zib/konrad-1
  run_daily: true

tasks:
  timesfm-code-analysis:
    enabled: true
    deployment_name: run-ai-task-timesfm-code-analysis
    parameters:
      prompt: >-
        Clone https://github.com/The-EPISERVE-Consortium/model__prediction__generic__timesfm,
        analyse the content and write a code analysis report to /output/report.pdf
